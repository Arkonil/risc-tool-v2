[project]
name = "risc-tool-v2"
version = "0.3.0"
description = "RisC Tool (Risk Identifier and Segmentation Creator): A platform for risk analysts to build and validate risk segmentation strategies."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "colorama>=0.4.6",
    "pandas>=3.0.3",
    "polars>=1.42.1",
    "pydantic>=2.13.4",
    "streamlit>=1.59.2",
    "streamlit-antd-components>=0.3.2",
    "streamlit-code-editor>=0.1.22",
    "streamlit-flow-component>=1.6.1",
    "streamlit-sortables>=0.3.1",
]

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.3",
    "pyright>=1.1.411",
    "pytest>=8.4.1",
    "ruff>=0.15.22",
]

[project.optional-dependencies]
e2e = [
    "seleniumbase>=4.52.4",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["risc_tool_v2*"]

[tool.ruff]
preview = true

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "logs",
    "risc_tool",
    "tests/_archive",
]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.12
target-version = "py312"

[tool.ruff.lint]
# select = [...]  # See the Default Rules page for the full listing.
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = ["_archive", "__pycache__", ".venv", ".ruff_cache", ".pytest_cache"]
markers = [
    "integration: End-to-end workflow tests for the iterations feature",
    "e2e: SeleniumBase end-to-end UI tests",
    "smoke: Critical path smoke tests",
    "regression: Full workflow regression tests",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
strictListInference = true
strictSetInference = true
strictDictionaryInference = true
exclude = ["**/tests/**", ".venv/**", "**/node_modules", "**/__pycache__", "**/.*", "risc_tool", "tests/_archive"]
ignore = ["**/tests/**", ".venv/**", "risc_tool", "tests/_archive"]
reportUnnecessaryComparison = false
